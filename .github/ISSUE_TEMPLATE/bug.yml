name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the demo with ?demo=1\n2. ..."
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [dashboard, service, mcp, launcher, contracts, ops, docs]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data, tokens or vault content first.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no vault content, credentials, host names, IPs or other personal data.
          required: true
