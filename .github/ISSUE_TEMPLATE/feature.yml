name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen? Alternatives you considered?
  - type: dropdown
    id: module
    attributes:
      label: Module
      options: [dashboard, service, mcp, launcher, contracts, ops, docs]
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What must be true for this to be finished (behavior, tests, docs).
