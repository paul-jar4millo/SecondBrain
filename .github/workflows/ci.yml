name: CI

# A single blocking job (verify) decides whether a change can be merged.
# Checks that depend on third parties or on software WebGL (dependency audit and
# browser suites) report warnings without blocking. Deployment lives in
# deploy.yml and only runs for version tags; it never runs for pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly dependency audit and browser suites (Mondays 15:23 UTC); a
    # failing browser suite opens an issue (browser-report).
    - cron: "23 15 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its previous run.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser: ${{ steps.changes.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # Browser suites only for pull requests that touch the UI or the service,
      # and for manual runs. Decided with git, without calling the GitHub API.
      - name: Do the browser suites need to run?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch | schedule) browser=true ;;
            pull_request)
              if files=$(git diff --name-only "$BASE" HEAD); then
                grep -qE '^(dashboard|service|launcher|contracts)/|^\.github/workflows/ci\.yml$' <<<"$files" && browser=true || browser=false
              else
                browser=true
              fi ;;
            *) browser=false ;;
          esac
          echo "browser=$browser" >> "$GITHUB_OUTPUT"
      - run: npm run setup
      - name: Lint and format
        run: |
          npm run lint
          npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: ShellCheck
        run: |
          find ops dashboard/ops -name '*.sh' -type f -print0 | xargs -0 shellcheck -S warning
          shellcheck -S warning ops/homelab/pc-wake ops/homelab/pc-status
      - name: Tests with coverage
        run: |
          npm run coverage
          npm run test:ops
          python3 -m unittest discover -s ops/migration/tests
          python3 -m unittest discover -s ops/backup/tests
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Line coverage"
            for module in contracts service mcp launcher dashboard; do
              file="coverage/$module/lcov.info"
              [ -f "$file" ] || continue
              awk -F: -v m="$module" '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f) printf "- %s: %.1f%%\n", m, 100*h/f}' "$file"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Package the application
        run: |
          mkdir -p release
          node ops/package-release.mjs release
          tar -czf release.tar.gz -C release .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secondbrain-${{ github.sha }}
          path: release.tar.gz
          retention-days: 3
          if-no-files-found: error
      # Browser jobs reuse this build instead of repeating it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dashboard/dist
          retention-days: 1
          if-no-files-found: error

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test ops/tests/commit-message.test.mjs
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          while read -r sha; do
            # GitHub's merge button creates a two-parent commit with its own
            # fixed subject; the authored commits were checked on the PR.
            parents=$(git show -s --format=%P "$sha")
            subject=$(git show -s --format=%s "$sha")
            if [[ "$parents" == *" "* && "$subject" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\  ]]; then
              continue
            fi
            git show -s --format=%B "$sha" | node ops/check-commit.mjs || exit 1
          done < <(git rev-list "$range")

  # Builds the service image the way deploy.yml does and runs the container
  # smoke test, so an image that cannot start fails here instead of at a tag.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run setup
      - name: Build the service image
        run: docker build --file dashboard/Dockerfile --build-arg "REVISION=$GITHUB_SHA" --tag second-brain:ci .
      - name: Smoke test the image
        working-directory: dashboard
        env:
          SB_SMOKE_IMAGE: second-brain:ci
        run: node ops/smoke-container.mjs

  # A new advisory in a third-party package must not block unrelated work:
  # this job stays green and leaves a visible warning. It also runs weekly.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Production dependencies
        run: |
          failed=""
          for package in contracts dashboard service mcp launcher; do
            if ! npm audit --workspace "$package" --omit=dev --audit-level=high; then
              failed="$failed $package"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::warning title=Audit::High-severity advisories in production dependencies:$failed. Review before merging."
          fi
      - name: Development dependencies (informational)
        run: |
          npm audit --workspace dashboard --audit-level=high \
            || echo "::notice title=Dev audit::The dashboard has advisories in development dependencies; they do not ship."

  # Software WebGL on shared machines: four groups, each retried once. Reports
  # on pull requests; it does not gate merges.
  browser:
    name: browser (${{ matrix.group }})
    needs: verify
    if: needs.verify.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: refuge-desktop
            commands: REFUGIO_PARTES=escritorio node ops/verify-refuge.mjs
          - group: refuge-layouts
            commands: REFUGIO_PARTES=descarga,layouts node ops/verify-refuge.mjs
          - group: refuge-mobile
            commands: REFUGIO_PARTES=movil,privado,sinwebgl node ops/verify-refuge.mjs
          - group: threads-and-tools
            commands: node ops/verify-approvals.mjs && node ops/verify-project-dashboards.mjs && node ops/verify-tools.mjs && node ops/verify-threads.mjs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dashboard/dist
      # The runner image ships Chrome: avoid downloading Chromium and its deps.
      - name: Browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npm exec --workspace dashboard -- playwright install --with-deps chromium
          fi
      - name: Verify ${{ matrix.group }}
        working-directory: dashboard
        env:
          COMMANDS: ${{ matrix.commands }}
          GROUP: ${{ matrix.group }}
        run: |
          for attempt in 1 2; do
            if bash -c "$COMMANDS"; then
              [ "$attempt" = 2 ] && echo "::warning title=Flaky::$GROUP passed only on the second attempt"
              exit 0
            fi
            echo "::warning title=Failure::$GROUP failed on attempt $attempt"
          done
          exit 1
      - name: Failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.group }}-${{ github.run_attempt }}
          path: .impeccable/review
          retention-days: 7
          if-no-files-found: ignore

  # The weekly run has nobody watching it: a failing browser suite opens one
  # issue (or comments on the open one) instead of failing silently.
  browser-report:
    needs: browser
    if: always() && github.event_name == 'schedule' && needs.browser.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly browser suites failing"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          body="The scheduled browser suites failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
