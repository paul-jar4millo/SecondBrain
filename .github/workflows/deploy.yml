name: Deploy

# Continuous delivery to the self-hosted production container.
#
# Safety model (see docs/ci-cd.md):
# - Only a pushed `v*` tag (or a manual run on such a tag) can start it; pull
#   requests, including those from forks, never reach the self-hosted runner.
# - The `deploy` job uses the `production` environment, which requires a manual
#   approval and only accepts `v*` tags. Host-specific values live in that
#   environment's variables and secrets, never in the repository.
# - The self-hosted job does not check out the repository: it only downloads the
#   artifact built and tested on a GitHub-hosted runner, and runs a fixed,
#   root-owned helper through a single sudo rule.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  build:
    permissions:
      contents: read
      packages: write
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm run setup
      - name: Test
        run: |
          npm test
          npm run test:api
          node --test ops/tests/*.test.mjs
      - name: Publish the immutable service image with an SBOM
        id: image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ github.sha }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --name secondbrain --driver docker-container --use
          docker buildx build --file dashboard/Dockerfile --platform linux/amd64 \
            --build-arg "REVISION=$REVISION" --tag "$repository:git-$REVISION" \
            --sbom=true --push --metadata-file image.json .
          digest=$(jq -er '."containerimage.digest"' image.json)
          printf 'reference=%s@%s\n' "$repository" "$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke test the published image
        working-directory: dashboard
        env:
          SB_SMOKE_IMAGE: ${{ steps.image.outputs.reference }}
        run: node ops/smoke-container.mjs
      - name: Package the native launcher and operations files
        env:
          SERVICE_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p release
          node ops/package-release.mjs release --native-host
          printf '%s\n' "$SERVICE_IMAGE" > release/image-reference
          tar -czf release.tar.gz -C release .
          sha256sum release.tar.gz | tee release.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secondbrain-${{ github.sha }}
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    # Never on forks or on anything but a version tag of this repository.
    if: github.repository_owner == vars.SB_DEPLOY_OWNER && github.ref_type == 'tag'
    runs-on: [self-hosted, linux, x64, secondbrain-production]
    environment:
      name: production
      url: ${{ vars.SB_PUBLIC_URL }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secondbrain-${{ github.sha }}
          path: /var/lib/sb-runner/incoming/${{ github.sha }}
      - name: Verify the artifact checksum
        working-directory: /var/lib/sb-runner/incoming/${{ github.sha }}
        run: sha256sum -c release.tar.gz.sha256
      - name: Activate the release (health check and automatic rollback)
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: sudo /usr/local/sbin/secondbrain-deploy "$RELEASE_SHA"
      - name: Public health check
        if: vars.SB_PUBLIC_URL != ''
        env:
          PUBLIC_URL: ${{ vars.SB_PUBLIC_URL }}
        run: curl -fsS --retry 5 --retry-delay 3 --max-time 10 "$PUBLIC_URL/api/v1/health"
      - name: Remove the temporary package
        if: always()
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: rm -rf -- "/var/lib/sb-runner/incoming/$RELEASE_SHA"
