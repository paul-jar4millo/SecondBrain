name: Live demo

# Builds the dashboard as a static, backend-less demo (synthetic data, English
# by default) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build the static demo
        working-directory: dashboard
        env:
          VITE_DEMO: "1"
          VITE_DEFAULT_LANG: en
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npx vite build --outDir dist-demo
          # Client-side routes: GitHub Pages serves 404.html for unknown paths.
          cp dist-demo/index.html dist-demo/404.html
      - name: Smoke test the demo in a browser
        working-directory: dashboard
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p "/tmp/site/$REPO" && cp -r dist-demo/. "/tmp/site/$REPO/"
          (cd /tmp/site && python3 -m http.server 4173 >/dev/null 2>&1 &)
          if command -v google-chrome >/dev/null; then
            export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
          fi
          node ops/verify-demo.mjs "http://127.0.0.1:4173/$REPO/" en
          node ops/verify-demo.mjs "http://127.0.0.1:4173/$REPO/?lang=es" es
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/dist-demo

  deploy:
    needs: build
    if: github.repository_owner == vars.SB_DEPLOY_OWNER
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
