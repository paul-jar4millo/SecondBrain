name: Live demo

# Builds the dashboard as a static, backend-less demo (synthetic data, English
# by default) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - name: Build the static demo
        working-directory: dashboard
        env:
          VITE_DEMO: "1"
          VITE_DEFAULT_LANG: en
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npx vite build --outDir dist-demo
          # Client-side routes: GitHub Pages serves 404.html for unknown paths.
          cp dist-demo/index.html dist-demo/404.html
      - name: Smoke test the demo in a browser
        working-directory: dashboard
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p "/tmp/site/$REPO" && cp -r dist-demo/. "/tmp/site/$REPO/"
          (cd /tmp/site && python3 -m http.server 4173 >/dev/null 2>&1 &)
          if command -v google-chrome >/dev/null; then
            export BROWSER_EXECUTABLE="$(command -v google-chrome)"
          else
            npx playwright install --with-deps chromium
          fi
          node ops/verify-demo.mjs "http://127.0.0.1:4173/$REPO/" en
          node ops/verify-demo.mjs "http://127.0.0.1:4173/$REPO/?lang=es" es
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dashboard/dist-demo

  deploy:
    needs: build
    if: github.repository_owner == vars.SB_DEPLOY_OWNER
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
