version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    # npm workspaces: one root lockfile covers every module.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the runtime (Node 24, see engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not accept TypeScript 7 as a peer yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # vitest and its plugins pin each other as exact peers.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /ops/agents
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    versioning-strategy: increase
    groups:
      agent-clis:
        patterns: ["@openai/codex", "@anthropic-ai/claude-code"]
