# Secret scanning (gitleaks). Default rules plus a narrow allowlist of
# synthetic values used by tests and the demo; none of them is a credential.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic test passwords and demo storage keys"
regexTarget = "match"
regexes = [
  '''una-clave-larga-segura-123''',
  '''clave-propietario-segura-999''',
  '''sb-refugio-orders-v1''',
]
