name: second-brain
services:
  app:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    image: second-brain:0.5.2
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports: ["127.0.0.1:8080:8080"]
    environment:
      VAULT_ROOT: /vault
      DATA_DIR: /data
      NODE_ENV: production
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.30.61.1}
    volumes:
      - type: bind
        source: ${VAULT_ROOT:?Define VAULT_ROOT con una carpeta de prueba}
        target: /vault
      - type: bind
        source: ${DATA_DIR:-./.data}
        target: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [brain]
networks:
  brain:
    ipam:
      config:
        - subnet: 172.30.61.0/24
          gateway: 172.30.61.1
